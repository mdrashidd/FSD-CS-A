<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="assignment1script.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo"></div>
                <h2>Counter App</h2>
            </div>
            <div class="counter-display">
                <span id="counter-value">0</span>
            </div>
            <div class="buttons">
                <button onclick="decrement()" id="decrement-btn">-</button>
                <button onclick="increment()" id="increment-btn">+</button>
            </div>
            <div class="message-container">
                <p id="message"></p>
            </div>
        </div>
    </div>
<script src="assignment1script.js"></script>
</body>
</html>
